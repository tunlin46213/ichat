# Builds an installable iChat.apk on a GitHub Linux runner (free, no Google Play
# account needed). Copy it to an Android phone and open it to install
# (allow "Install unknown apps" for the browser / file manager when asked).
#
# Run it: GitHub repo → Actions → "Android APK build" → Run workflow.
# Download: open the finished run → Artifacts → iChat-apk.
#
# Separate from the iOS sideload build: the native android/ folder is generated
# here on the runner only (Continuous Native Generation), nothing iOS changes.
name: Android APK build

on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        # arm64 only: every Android phone from the last ~8 years, and a much smaller APK.
        # The release build is signed with the template's debug key, so it installs
        # directly and later builds update it in place.
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../iChat.apk
          ls -lh ../iChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iChat-apk
          path: iChat.apk
          retention-days: 14
