# Builds an UNSIGNED iChat.ipa on a GitHub macOS runner (no Mac or paid Apple
# account needed). Install it on an iPhone with Sideloadly + a free Apple ID.
#
# Run it: GitHub repo → Actions → "iOS sideload build" → Run workflow.
# Download: open the finished run → Artifacts → iChat-ipa.
name: iOS sideload build

on:
  workflow_dispatch:

concurrency:
  group: ios-sideload
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIDELOAD: '1' # app.config.js drops push (not allowed for free Apple IDs)
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project
        # Also runs `pod install`.
        run: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install

      - name: Build (no code signing)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME from $WORKSPACE"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tail -n 200

      - name: Package iChat.ipa
        run: |
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry iChat.ipa Payload
          ls -lh iChat.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: iChat-ipa
          path: iChat.ipa
          retention-days: 14
